<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Cookbook</title>
<meta name="theme-color" content="#b5532f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cookbook">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    --bg: #faf6f0; --card: #ffffff; --ink: #2b2420; --muted: #7a6e66;
    --accent: #b5532f; --accent-soft: #f4e2d8; --line: #e8dfd5; --ok: #3d7a4a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1916; --card: #26221e; --ink: #f1ebe4; --muted: #a89c92;
      --accent: #e0835d; --accent-soft: #3a2a22; --line: #3a342e; --ok: #7cc28a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
  }
  header { padding: 20px 16px 8px; max-width: 900px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 1.6rem; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 16px; }
  section[hidden] { display: none; }
  h2 { font-size: 1.15rem; margin: 16px 0 10px; }
  .banner { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin: 8px 0; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .meta { color: var(--muted); font-size: .85rem; display: flex; gap: 10px; flex-wrap: wrap; }
  .card details { margin-top: 8px; font-size: .9rem; }
  .card ul { margin: 6px 0 0; padding-left: 18px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  button, select, input {
    font: inherit; color: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); padding: 8px 12px; min-height: 40px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: none; background: none; color: var(--accent); padding: 4px; min-height: 0; }
  .week { display: grid; gap: 8px; }
  .day { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center;
         background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .day .date { font-weight: 600; font-size: .95rem; }
  .day .date small { display: block; color: var(--muted); font-weight: 400; }
  .day .what.empty { color: var(--muted); font-style: italic; }
  .day .what .left { color: var(--muted); font-size: .85rem; }
  .day.today { border-color: var(--accent); }
  .weeknav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: .95rem; }
  th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  td.num, th.num { text-align: right; white-space: nowrap; }
  tr.got td { text-decoration: line-through; color: var(--muted); }
  tfoot td { font-weight: 700; border-bottom: none; }
  td input[type=checkbox] { width: 20px; height: 20px; min-height: 0; }
  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button { flex: 1; border: none; border-radius: 0; background: none; padding: 12px 4px; min-height: 60px; font-size: .85rem; color: var(--muted); }
  nav.tabs button[aria-selected=true] { color: var(--accent); font-weight: 700; }
  nav.tabs span { display: block; font-size: 1.3rem; }
  dialog { border: none; border-radius: 16px; padding: 18px; background: var(--card); color: var(--ink); width: min(420px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog label { display: block; margin: 10px 0 4px; font-size: .9rem; color: var(--muted); }
  dialog select { width: 100%; }
  .muted { color: var(--muted); font-size: .85rem; }
  .chip { display: inline-block; background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; font-size: .8rem; margin: 2px 4px 0 0; }
  .sides label { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--ink); font-size: 1rem; }
  .sides input { width: 20px; height: 20px; min-height: 0; }
  @media (max-width: 480px) { .day { grid-template-columns: 74px 1fr auto; } }
</style>
</head>
<body>
<header>
  <h1>Family Cookbook</h1>
  <p id="source"></p>
</header>

<main>
  <section id="tab-meals">
    <h2>Meals</h2>
    <div id="meals" class="grid"></div>
    <h2>Sides</h2>
    <div id="sides" class="grid"></div>
  </section>

  <section id="tab-week" hidden>
    <div class="weeknav">
      <button id="prevWeek" aria-label="Previous week">‹ Prev</button>
      <h2 id="weekLabel" style="margin:0"></h2>
      <button id="nextWeek" aria-label="Next week">Next ›</button>
    </div>
    <div id="week" class="week"></div>
    <p class="muted">A meal fills as many days as it usually lasts you. Tap "Plan" on a meal to add it.</p>
  </section>

  <section id="tab-list" hidden>
    <h2 id="listLabel">Grocery list</h2>
    <div id="list"></div>
    <p class="muted">Prices are estimates and change with sales. Tick items off as you shop.</p>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="meals" aria-selected="true"><span>🍲</span>Meals</button>
  <button role="tab" data-tab="week" aria-selected="false"><span>📅</span>Week</button>
  <button role="tab" data-tab="list" aria-selected="false"><span>🛒</span>Groceries</button>
</nav>

<dialog id="planDialog">
  <form method="dialog">
    <h3 id="planTitle" style="margin:0"></h3>
    <p class="muted" id="planHint"></p>
    <label for="planDay">Start on</label>
    <select id="planDay"></select>
    <div id="sidesBox"></div>
    <div class="row" style="justify-content:flex-end">
      <button value="cancel">Cancel</button>
      <button value="ok" class="primary">Add to plan</button>
    </div>
  </form>
</dialog>

<script>
// The family Google Sheet. It must be shared as "Anyone with the link can view".
// Set to "" to use the sample data below instead.
const SHEET_ID = "1dlIUs8wQnoclmrsKIw74Jd97--qVlripfQ32whI2uOY";
const TABS = { meals: "Meals", ingredients: "Ingredients", prices: "Prices" };

// Same columns as the Sheet, with headers normalised (lowercase, non-letters become "_").
const SAMPLE = {
  meals: [
    { meal: "Pot Roast", type: "Meal", serves: "4", lasts_days: "2", goes_well_with: "Yorkshire Puddings, Spinach",
      notes: "Roast with russets, carrots and beef stock." },
    { meal: "Yorkshire Puddings", type: "Side", serves: "4", lasts_days: "1", goes_well_with: "Pot Roast", notes: "" },
    { meal: "Spinach", type: "Side", serves: "4", lasts_days: "1", goes_well_with: "Pot Roast", notes: "Frozen bag, Compliments." }
  ],
  ingredients: [
    { meal: "Pot Roast", ingredient: "Beef roast", amount_used: "1 roast, about 3 lb", share_of_package_used: "1" },
    { meal: "Pot Roast", ingredient: "Russet potatoes", amount_used: "about 3 lb", share_of_package_used: "0.3" },
    { meal: "Pot Roast", ingredient: "Carrots", amount_used: "about 1 lb", share_of_package_used: "0.5" },
    { meal: "Pot Roast", ingredient: "Beef stock", amount_used: "1 carton", share_of_package_used: "1" },
    { meal: "Yorkshire Puddings", ingredient: "Flour", amount_used: "1 cup", share_of_package_used: "0.05" },
    { meal: "Yorkshire Puddings", ingredient: "Eggs", amount_used: "3 eggs", share_of_package_used: "0.25" },
    { meal: "Yorkshire Puddings", ingredient: "Salt", amount_used: "a pinch", share_of_package_used: "0.01" },
    { meal: "Spinach", ingredient: "Frozen spinach", amount_used: "1 bag", share_of_package_used: "1" }
  ],
  prices: [
    { item: "Beef roast", package_size: "about 3 lb", price: "35.00", store: "Safeway" },
    { item: "Russet potatoes", package_size: "10 lb bag", price: "7.99", store: "Safeway" },
    { item: "Carrots", package_size: "2 lb bag", price: "3.49", store: "Safeway" },
    { item: "Beef stock", package_size: "900 ml carton", price: "3.29", store: "Safeway" },
    { item: "Flour", package_size: "2.5 kg bag", price: "6.99", store: "Safeway" },
    { item: "Eggs", package_size: "dozen", price: "4.99", store: "Safeway" },
    { item: "Salt", package_size: "1 kg", price: "2.49", store: "Safeway" },
    { item: "Frozen spinach", package_size: "500 g bag", price: "3.49", store: "Safeway" }
  ]
};

let data = SAMPLE;
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let plan = store.get("plan2", []);         // [{ meal, start: "YYYY-MM-DD", sides: [names] }]
let got = store.get("got", {});            // { item key: true }
let weekStart = mondayOf(new Date());

// ---------- data loading ----------
function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); rows.push(row); row = []; field = "";
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  const [head = [], ...body] = rows;
  const keys = head.map(h => h.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""));
  return body.filter(r => r.some(v => v.trim())).map(r =>
    Object.fromEntries(keys.map((k, i) => [k, (r[i] ?? "").trim()])));
}

async function loadSheet() {
  const url = t => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(t)}`;
  const [meals, ingredients, prices] = await Promise.all(
    [TABS.meals, TABS.ingredients, TABS.prices].map(t => fetch(url(t)).then(r => {
      if (!r.ok) throw new Error(`Could not read the "${t}" tab. Is the Sheet shared as "anyone with the link"?`);
      return r.text();
    }).then(parseCSV)));
  if (!meals.length || !("meal" in meals[0])) throw new Error("The Sheet didn't come back as expected. Is it shared as \"anyone with the link\"?");
  return { meals, ingredients, prices };
}

async function init() {
  const src = document.getElementById("source");
  if (SHEET_ID) {
    try { data = await loadSheet(); src.textContent = "Live from the family Google Sheet"; }
    catch (e) { src.textContent = "Showing sample data. " + e.message; }
  } else {
    src.textContent = "Showing sample data";
  }
  renderAll();
}

// ---------- helpers ----------
function num(v) { const n = parseFloat(String(v ?? "").replace(/[$,]/g, "")); return isNaN(n) ? 0 : n; }
function money(n) { return "$" + n.toFixed(2); }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fromIso(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); }
const same = (a, b) => String(a ?? "").trim().toLowerCase() === String(b ?? "").trim().toLowerCase();
function mealByName(n) { return data.meals.find(m => same(m.meal, n)); }
function isSide(m) { return same(m.type, "side"); }
function lastsDays(m) { return Math.max(1, Math.round(num(m.lasts_days)) || 1); }
function goesWith(m) { return String(m.goes_well_with || "").split(",").map(s => s.trim()).filter(Boolean); }
function ingredientsOf(name) { return data.ingredients.filter(i => same(i.meal, name)); }
function priceOf(item) { return data.prices.find(p => same(p.item, item)); }
function lineCost(ing) {
  if (ing.est_cost) return num(ing.est_cost);
  const p = priceOf(ing.ingredient);
  return p ? num(ing.share_of_package_used) * num(p.price) : null;
}
function mealCost(m) {
  if (m.est_cost) return num(m.est_cost);
  return ingredientsOf(m.meal).reduce((t, i) => t + (lineCost(i) ?? 0), 0);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

// ---------- meals ----------
function mealCard(m) {
  const days = lastsDays(m), cost = mealCost(m);
  const pairs = goesWith(m);
  return `<article class="card">
    <h3>${esc(m.meal)}</h3>
    <div class="meta">
      <span>Serves ${esc(m.serves || "?")}</span>
      ${isSide(m) ? "" : `<span>Lasts ${days} day${days > 1 ? "s" : ""}</span>`}
      <span>≈ ${money(cost)}</span>
      ${isSide(m) || days < 2 ? "" : `<span>≈ ${money(cost / days)}/day</span>`}
    </div>
    ${m.notes ? `<p style="margin:8px 0 0;font-size:.9rem">${esc(m.notes)}</p>` : ""}
    ${pairs.length ? `<div style="margin-top:6px"><span class="muted">Goes well with </span>${pairs.map(p => `<span class="chip">${esc(p)}</span>`).join("")}</div>` : ""}
    <details><summary>Ingredients</summary><ul>
      ${ingredientsOf(m.meal).map(i => {
        const c = lineCost(i);
        return `<li>${esc(i.ingredient)}${i.amount_used ? `, ${esc(i.amount_used)}` : ""} <span class="muted">${c === null ? "(no price yet)" : "≈ " + money(c)}</span></li>`;
      }).join("")}
    </ul></details>
    ${isSide(m) ? "" : `<div class="row"><button class="primary" data-plan="${esc(m.meal)}">Plan</button></div>`}
  </article>`;
}
function renderMeals() {
  const mains = data.meals.filter(m => !isSide(m)), sides = data.meals.filter(isSide);
  document.getElementById("meals").innerHTML = mains.length ? mains.map(mealCard).join("") : `<p class="muted">No meals yet.</p>`;
  document.getElementById("sides").innerHTML = sides.length ? sides.map(mealCard).join("") : `<p class="muted">No sides yet.</p>`;
}

// ---------- planning ----------
function coverage() {
  // date -> { meal, dayIndex, days, entry }
  const map = {};
  [...plan].sort((a, b) => a.start.localeCompare(b.start)).forEach(entry => {
    const m = mealByName(entry.meal); if (!m) return;
    const days = lastsDays(m);
    for (let i = 0; i < days; i++) map[iso(addDays(fromIso(entry.start), i))] = { meal: m, dayIndex: i, days, entry };
  });
  return map;
}

function renderWeek() {
  const cov = coverage(), today = iso(new Date());
  const end = addDays(weekStart, 6);
  const opt = { month: "short", day: "numeric" };
  document.getElementById("weekLabel").textContent =
    weekStart.toLocaleDateString(undefined, opt) + " – " + end.toLocaleDateString(undefined, opt);
  document.getElementById("week").innerHTML = Array.from({ length: 7 }, (_, i) => {
    const d = addDays(weekStart, i), key = iso(d), c = cov[key];
    const label = `<div class="date">${d.toLocaleDateString(undefined, { weekday: "short" })}<small>${d.toLocaleDateString(undefined, opt)}</small></div>`;
    const cls = `day ${key === today ? "today" : ""}`;
    if (!c) return `<div class="${cls}">${label}<div class="what empty">Nothing planned</div><span></span></div>`;
    const sides = (c.entry.sides || []).length ? ` with ${c.entry.sides.map(esc).join(" and ")}` : "";
    const left = c.dayIndex === 0 ? "Cook day" : `Leftovers, day ${c.dayIndex + 1} of ${c.days}`;
    return `<div class="${cls}">${label}
      <div class="what">${esc(c.meal.meal)}${sides}<div class="left">${left}</div></div>
      ${c.dayIndex === 0 ? `<button class="link" data-remove="${esc(c.entry.meal)}|${c.entry.start}" aria-label="Remove">✕</button>` : "<span></span>"}
    </div>`;
  }).join("");
}

let planning = null;
function openPlan(name) {
  const m = mealByName(name); planning = m.meal;
  const days = lastsDays(m);
  document.getElementById("planTitle").textContent = m.meal;
  document.getElementById("planHint").textContent = `Usually lasts ${days} day${days > 1 ? "s" : ""}, so it will fill that many days.`;
  const sel = document.getElementById("planDay");
  const thisWeek = mondayOf(new Date());
  const base = thisWeek > weekStart ? thisWeek : weekStart;
  sel.innerHTML = Array.from({ length: 14 }, (_, i) => {
    const d = addDays(base, i);
    return `<option value="${iso(d)}">${d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" })}</option>`;
  }).join("");
  const cov = coverage();
  const firstFree = [...sel.options].find(o => !cov[o.value] && o.value >= iso(new Date()));
  if (firstFree) sel.value = firstFree.value;
  const sides = data.meals.filter(isSide);
  const pairs = goesWith(m);
  document.getElementById("sidesBox").innerHTML = sides.length ? `<label>Sides (pick 1 or 2)</label><div class="sides">${sides.map(s =>
    `<label><input type="checkbox" name="side" value="${esc(s.meal)}"> ${esc(s.meal)} <span class="muted">≈ ${money(mealCost(s))}</span>${pairs.some(p => same(p, s.meal)) ? ` <span class="chip">goes well</span>` : ""}</label>`
  ).join("")}</div>` : "";
  document.getElementById("planDialog").showModal();
}
document.getElementById("planDialog").addEventListener("close", e => {
  if (e.target.returnValue === "ok" && planning) {
    const start = document.getElementById("planDay").value;
    const sides = [...document.querySelectorAll("#sidesBox input[name=side]:checked")].map(i => i.value);
    plan.push({ meal: planning, start, sides });
    store.set("plan2", plan);
    weekStart = mondayOf(fromIso(start));
    renderAll(); showTab("week");
  }
  planning = null;
});

// ---------- grocery list ----------
// Adds up the share of each package used by the meals that start this week,
// then rounds up to whole packages to buy.
function renderList() {
  const from = iso(weekStart), to = iso(addDays(weekStart, 6));
  const entries = plan.filter(p => p.start >= from && p.start <= to);
  const el = document.getElementById("list");
  if (!entries.length) { el.innerHTML = `<div class="banner">No meals start this week yet. Plan some from the Meals tab.</div>`; return; }
  const items = {};
  entries.forEach(e => [e.meal, ...(e.sides || [])].forEach(name => ingredientsOf(name).forEach(i => {
    const key = i.ingredient.trim().toLowerCase();
    items[key] ??= { name: i.ingredient, share: 0, uses: [] };
    items[key].share += num(i.share_of_package_used);
    if (i.amount_used) items[key].uses.push(i.amount_used);
  })));
  let total = 0, left = 0, used = 0;
  const body = Object.entries(items).sort((a, b) => a[1].name.localeCompare(b[1].name)).map(([key, it]) => {
    const p = priceOf(it.name);
    const packs = Math.max(1, Math.ceil(it.share - 1e-9));
    const cost = p ? packs * num(p.price) : null;
    if (cost !== null) { total += cost; used += it.share * num(p.price); if (!got[key]) left += cost; }
    const size = p?.package_size ? `${packs} × ${esc(p.package_size)}` : `${packs} package${packs > 1 ? "s" : ""}`;
    return `<tr class="${got[key] ? "got" : ""}">
      <td><input type="checkbox" data-got="${esc(key)}" ${got[key] ? "checked" : ""} aria-label="Got ${esc(it.name)}"></td>
      <td>${esc(it.name)}<div class="muted">${size}${it.uses.length ? ` · using ${it.uses.map(esc).join(" + ")}` : ""}</div></td>
      <td class="num">${cost === null ? "?" : money(cost)}</td></tr>`;
  }).join("");
  el.innerHTML = `<table>
    <thead><tr><th></th><th>Item</th><th class="num">Est.</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td></td><td>Estimated total</td><td class="num">${money(total)}</td></tr>
    <tr><td></td><td class="muted" style="font-weight:400">Still to buy</td><td class="num muted" style="font-weight:400">${money(left)}</td></tr>
    <tr><td></td><td class="muted" style="font-weight:400">Value of what the meals actually use</td><td class="num muted" style="font-weight:400">${money(used)}</td></tr></tfoot>
  </table>
  <div class="row"><button id="clearGot">Untick all</button></div>`;
}

// ---------- wiring ----------
function renderAll() { renderMeals(); renderWeek(); renderList(); }
function showTab(name) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === name));
  ["meals", "week", "list"].forEach(t => document.getElementById("tab-" + t).hidden = t !== name);
  window.scrollTo(0, 0);
}
document.querySelector("nav.tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.tab); });
document.getElementById("prevWeek").onclick = () => { weekStart = addDays(weekStart, -7); renderWeek(); renderList(); };
document.getElementById("nextWeek").onclick = () => { weekStart = addDays(weekStart, 7); renderWeek(); renderList(); };
document.body.addEventListener("click", e => {
  const p = e.target.closest("[data-plan]"); if (p) return openPlan(p.dataset.plan);
  const r = e.target.closest("[data-remove]");
  if (r) {
    const [name, start] = r.dataset.remove.split("|");
    plan = plan.filter(x => !(same(x.meal, name) && x.start === start));
    store.set("plan2", plan); renderAll();
  }
  if (e.target.id === "clearGot") { got = {}; store.set("got", got); renderList(); }
});
document.body.addEventListener("change", e => {
  const g = e.target.closest("[data-got]");
  if (g) { got[g.dataset.got] = g.checked; store.set("got", got); renderList(); }
});
init();
</script>
</body>
</html>
